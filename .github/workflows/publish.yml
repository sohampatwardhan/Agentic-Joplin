name: Publish to npm

# Publishes the MCP server workspace (packages/mcp-server, npm name `agentic-joplin`)
# whenever a GitHub Release is published. The release tag must match the package version,
# e.g. tag `v0.1.0` for version `0.1.0`.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # avoid cache poisoning in a job holding publish credentials

      - name: Verify release tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./packages/mcp-server/package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match agentic-joplin version '$VERSION'. Bump packages/mcp-server/package.json or retag."
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          DIST_TAG=latest
          if [ "$PRERELEASE" = "true" ]; then DIST_TAG=next; fi
          npm publish --workspace agentic-joplin --provenance --access public --tag "$DIST_TAG"
